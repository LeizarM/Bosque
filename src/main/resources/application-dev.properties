# =============================================================================
#  PERFIL dev — la maquina del desarrollador (Windows)
#
#  Se activa con:   SPRING_PROFILES_ACTIVE=dev
#  En IntelliJ: Run > Edit Configurations > Environment variables.
#
#  Pisa lo que haga falta de application.properties. Nada de secretos aca.
# =============================================================================

# HTTP plano. El certificado de produccion no esta —ni tiene que estar— en la
# maquina de nadie.
server.port=${SERVER_PORT:9223}
server.ssl.enabled=false

# ── Base de datos ────────────────────────────────────────────────────────────
# Default: BOSQUE2PRUEBA, NO la de produccion.
#
# Es el default mas importante de todo el archivo. Antes el unico
# application.properties apuntaba a BOSQUE-2_0, asi que cada ABM que alguien
# probaba en su maquina escribia en la base real de la empresa, y para evitarlo
# habia que acordarse de editar el archivo — y despues acordarse de revertirlo
# antes de commitear. No funciono nunca.
#
# Para apuntar a produccion desde desarrollo (leer un dato, reproducir un bug)
# hay que decirlo en voz alta:  DB_NAME=BOSQUE-2_0
spring.datasource.url=jdbc:jtds:sqlserver://${DB_HOST:192.168.3.116}:${DB_PORT:1433}/${DB_NAME:BOSQUE2PRUEBA}

# Pool chico: una sola persona usando la app.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# jTDS 1.3.1 es de 2013 y su Connection.isValid() no es confiable. Sin esto,
# Hikari avisa por log y valida mal las conexiones del pool.
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Actuator ─────────────────────────────────────────────────────────────────
# Solo health. Ni siquiera en desarrollo conviene acostumbrarse a "*".
management.endpoints.web.exposure.include=health

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.bo.bosque.com.impexpap=DEBUG

# ── Archivos subidos ─────────────────────────────────────────────────────────
# Relativo al directorio del proyecto. En produccion es /app/uploads.
uploads.dir=./uploads

# ── WhatsApp: apagado ────────────────────────────────────────────────────────
# 'simular' recorre TODO el camino (consulta, filtro por tipo, telefono desde
# SAP, armado del texto) y loguea el mensaje en vez de mandarlo. Gana sobre
# notificar-cliente y sobre telefono-prueba, asi que es el unico interruptor que
# garantiza que desde una maquina de desarrollo no le salga un WhatsApp a un
# cliente de verdad. Va encendido por defecto y se apaga a mano si hace falta.
openwa.entregas.simular=${OPENWA_SIMULAR:true}
openwa.entregas.notificar-cliente=false
openwa.entregas.pedir-calificacion=false
openwa.webhook.habilitado=false
