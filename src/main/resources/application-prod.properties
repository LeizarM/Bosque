# =============================================================================
#  PERFIL prod — servidor Fedora, dentro del contenedor podman
#
#  Se activa con:   SPRING_PROFILES_ACTIVE=prod
#  en ~/.config/bosque/bosque.env, que podman pasa con --env-file.
#
#  Reemplaza al application.properties que vivia suelto en el servidor y que
#  nadie versionaba. Nada de secretos aca: todos por variable de entorno.
# =============================================================================

# ── HTTP detras de Caddy ─────────────────────────────────────────────────────
# Spring no maneja TLS. El HTTPS lo atiende el Caddy del servidor
# (/etc/caddy/Caddyfile): recibe app.esppapel.com en el 443 y en el 8443, saca y
# renueva el certificado solo, y reenvia en HTTP a 127.0.0.1:8008, que el
# contenedor publica hacia este puerto. No hay keystore que renovar a mano ni
# contrasena que guardar. Ver LEEME-SECRETS.md.
#
# Adentro del contenedor sigue siendo 8443 porque el HEALTHCHECK del Dockerfile
# mira ese puerto. Desde afuera solo se llega por Caddy.
server.port=${SERVER_PORT:8443}

# ── Base de datos ────────────────────────────────────────────────────────────
# Sin defaults de host ni de base: en produccion se declaran explicitamente en
# el env-file. Un default aca es una forma de apuntar sin querer a otro lado.
spring.datasource.url=jdbc:jtds:sqlserver://${DB_HOST}:${DB_PORT:1433}/${DB_NAME}

# Los mismos valores que ya venia usando el servidor.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── Actuator ─────────────────────────────────────────────────────────────────
# ANTES: management.endpoints.web.exposure.include=*
#
# Ese asterisco publica /actuator/heapdump, que vuelca la memoria ENTERA del
# proceso: adentro estan el secreto de firma del JWT, la clave de la base y los
# tokens de las sesiones abiertas. MainSecurity exige token para todo, pero
# alcanza con CUALQUIER usuario autenticado —un ROLE_LIM— para bajarlo,
# extraer la clave de firma y emitirse un token de administrador. Escalada de
# privilegios completa desde el rol mas limitado.
#
# Lista blanca, y nada mas que lo que Prometheus necesita.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ── Logging ──────────────────────────────────────────────────────────────────
# INFO, no DEBUG: en DEBUG, SpHelper escribe el nombre del SP y las claves de
# los parametros en CADA peticion.
logging.level.bo.bosque.com.impexpap=INFO

# ── Archivos subidos ─────────────────────────────────────────────────────────
# Coincide con el WORKDIR /app del Containerfile y con el volumen montado. Si
# no coincidieran, los vouchers y las fotos se escribirian dentro del
# contenedor y desaparecerian al recrearlo.
# Parametrizado para poder levantar este perfil en Windows: ahi /app/uploads se
# resuelve como C:\app\uploads y los reportes no encontrarian las imagenes.
uploads.dir=${UPLOADS_DIR:/app/uploads}

# ── PDF de los cheques y de las postergaciones ──────────────────────────────
# Viven dentro de uploads.dir (/app/uploads, el volumen persistente de arriba), en las
# subcarpetas cheques/ y postergacionCheques/ (cheques.pdf.dir y cheques.postergacion.pdf.dir
# de application.properties). No hace falta configurar nada: la carpeta se crea al subir el
# primer PDF y sobrevive a recrear el contenedor porque esta en el volumen. Para usar otra
# carpeta (por ejemplo una compartida con el sistema anterior, montada con -v) declarar
# CHEQUES_PDF_DIR / POSTERGACIONES_PDF_DIR en ~/.config/bosque/bosque.env.
