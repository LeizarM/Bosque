server.port=8443
#spring.datasource.url=jdbc:jtds:sqlserver://181.114.119.194:8700/BOSQUE-2_0
spring.datasource.url=jdbc:jtds:sqlserver://192.168.3.116:1433/BOSQUE-2_0
spring.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver


server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bosque

# ESTA LINEA FALTABA: es la que aborta el arranque.
jwt.secret=${JWT_SECRET}
# Estaba en 86400000, que son MILISEGUNDOS. Se expresa en SEGUNDOS.
# 86400 = 1 dia. JwtProvider valida el rango y rechaza el valor viejo.
jwt.expiration=86400

# El '#' solo comenta al PRINCIPIO de la linea: con el comentario pegado atras,
# el directorio temporal se llamaba "/tmp/jasper-clean  # Fuerza un dir limpio".
# Fuerza un dir limpio
net.sf.jasperreports.compiler.temp.dir=/tmp/jasper-clean
# Evita guardar .java temporales con hashes
net.sf.jasperreports.compiler.keep.java.file=false
uploads.dir=/app/uploads

spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jackson.time-zone=America/La_Paz

# Proxies de confianza para X-Forwarded-For. VACIO = se usa la IP real de la
# conexion. Si entra un nginx adelante, poner su IP aca.
security.proxies-confiables=${PROXIES_CONFIABLES:}


#Prometheus
# LISTA BLANCA. Antes era "*", que publica /actuator/heapdump: un volcado de la
# memoria entera, con el jwt.secret y la clave de la base adentro. Cualquier
# usuario autenticado —un ROLE_LIM— lo baja y se firma un token de admin.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true


# Prevencion XSS
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# Tamano de imagenes para subir al servidor
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB