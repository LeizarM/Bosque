# =============================================================================
#  CONFIGURACION COMUN A TODOS LOS ENTORNOS
#
#  Lo que cambia entre desarrollo y produccion NO vive aca: vive en
#  application-dev.properties y application-prod.properties, y se elige con
#
#      SPRING_PROFILES_ACTIVE=dev     (o prod)
#
#  Antes habia DOS archivos distintos —uno en el repositorio y otro en el
#  servidor— con puerto, driver, SSL y actuator diferentes, y sin forma de
#  saber cual estaba corriendo. Eso se termino: un solo arbol de fuentes, un
#  solo jar, y el entorno lo decide una variable.
#
#  NINGUN SECRETO EN ESTOS ARCHIVOS. Van por variable de entorno; sin default,
#  para que falten a gritos y no en silencio. Ver LEEME-SECRETS.md.
# =============================================================================

# ── Perfil activo ────────────────────────────────────────────────────────────
# Si nadie dice nada, gana 'dev': base de PRUEBA, sin SSL, WhatsApp apagado.
#
# El default tiene que ser el inofensivo, y por eso NO es 'prod':
#
#   - default 'prod' en la maquina de un desarrollador  -> revienta al arrancar
#     buscando /etc/bosque/keystore.p12, que solo existe en el contenedor. Le
#     pasa a cada persona que clone el repositorio, todos los dias.
#
#   - default 'dev' en el servidor (si faltara la variable) -> arranca en 9223
#     sin SSL contra BOSQUE2PRUEBA. Es un error, pero NO toca la base real y se
#     nota enseguida: el contenedor publica 8443 y ahi no contesta nadie.
#
# Que produccion dependa de una variable no es una debilidad si el despliegue la
# exige: deploy.sh la verifica ANTES de compilar y aborta si falta. Un perfil de
# produccion se declara, no se hereda por descarte.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── DataSource ────────────────────────────────────────────────────────────────
# El driver es el MISMO en los dos entornos, y por eso vive aca. Antes
# desarrollo usaba mssql-jdbc y produccion jTDS: se probaba con un driver y se
# desplegaba con otro. Este codigo depende del driver en cuatro lugares (los
# metadatos que lee SimpleJdbcCall, setObject(i,null) en ejecutarAbmMap, el
# recorrido de varios ResultSets, y date vs datetime), asi que esa diferencia
# garantizaba que los fallos aparecieran recien en el servidor.
# La URL cambia por entorno -> esta en cada perfil.
spring.datasource.driver-class-name=net.sourceforge.jtds.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.time-zone=America/La_Paz

# ── Seguridad / JWT ──────────────────────────────────────────────────────────
# Secreto de firma HS512. SIN DEFAULT: la app no arranca si falta.
# Antes esto era una clave RSA escrita dentro de JwtConfig.java y versionada en
# git, o sea que cualquiera con acceso al repositorio podia firmarse un token de
# administrador. Generar con:  openssl rand -base64 64
# Minimo 64 bytes decodificados; JwtProvider lo valida al arrancar.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000}

# ── Proxies de confianza (cabecera X-Forwarded-For) ──────────────────────────
# Lista de IPs, separadas por coma, de las que SI se acepta X-Forwarded-For.
# VACIO por defecto = no se confia en la cabecera y siempre se usa la IP real de
# la conexion. Es lo correcto cuando el backend atiende directo.
# Si el dia de manana entra un nginx/haproxy adelante, poner aca su IP; hasta
# entonces, dejarlo vacio: cualquiera puede escribir X-Forwarded-For a mano y
# con eso evadia el rate limit del login y el bloqueo por intentos fallidos.
security.proxies-confiables=${PROXIES_CONFIABLES:}

# ── Subida de archivos ───────────────────────────────────────────────────────
# 15MB, que es lo que ya tenia produccion. Desarrollo estaba en 10MB: un archivo
# de 12MB pasaba en el servidor y fallaba en la maquina del que lo probaba.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ── Codificacion ─────────────────────────────────────────────────────────────
# Forzar UTF-8 en peticion y respuesta. Estaba solo en produccion; con Windows
# en desarrollo y Linux en el servidor, dejarlo al default del sistema es pedir
# que los acentos se vean distinto en cada lado.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ── Banner ────────────────────────────────────────────────────────────────────
spring.main.banner-mode=console

# ── Logging ───────────────────────────────────────────────────────────────────
# El nivel de la aplicacion se define por perfil: DEBUG en dev, INFO en prod.
logging.level.root=INFO

# ── Reportes (JasperReports) ─────────────────────────────────────────────────
# OJO: en un .properties el '#' solo abre comentario al PRINCIPIO de la linea.
# Produccion tenia estas dos con el comentario pegado al final del valor, o sea
# que el directorio temporal se llamaba literalmente
# "/tmp/jasper-clean  # Fuerza un dir limpio". Los comentarios van arriba.
net.sf.jasperreports.compiler.temp.dir=/tmp/jasper-clean
net.sf.jasperreports.compiler.keep.java.file=false

# ── WhatsApp / openWA ─────────────────────────────────────────────────────────
# [PRUEBA] En produccion el backend corre junto al contenedor y ahi vale
# host.containers.internal:2785. Desde una PC ese nombre NO resuelve ("Host desconocido"),
# por eso apunta a la IP. Al volver a produccion, restaurar host.containers.internal.
openwa.url=${OPENWA_URL:http://181.114.119.195:2785}
# Credenciales de openWA. Van VACIAS por defecto: son secretos y no se escriben
# aca. Se setean por variable de entorno (ver LEEME-SECRETS.md).
# Vacio NO impide arrancar —a diferencia de la base y del JWT— porque WhatsApp
# es accesorio: sin clave los envios fallan y quedan en el log, pero el ERP
# sigue funcionando. Fallar el arranque entero por esto seria peor.
openwa.session-id=${OPENWA_SESSION_ID:}
openwa.api-key=${OPENWA_API_KEY:}
openwa.default-phone=${OPENWA_DEFAULT_PHONE:59178888274@c.us}
# Maximo 2 grupos (separados por coma); los demas se descartan con un warn.
openwa.groups=${OPENWA_GROUPS:59178888272-1422893975@g.us}
openwa.pais-prefijo=${OPENWA_PAIS_PREFIJO:591}
# Aviso al cliente. Apagado por defecto: enciendelo recien despues de probar en un dia real,
# porque a partir de ese momento salen mensajes hacia AFUERA de la empresa.
openwa.entregas.notificar-cliente=${OPENWA_NOTIF_CLIENTE:false}
# Tipos de documento que llevan aviso. Lista BLANCA: 'Traspaso' queda afuera porque es un
# movimiento entre almacenes propios, sin cliente ni numero (su cardCode viene siempre vacio).
openwa.entregas.tipos-con-aviso=${OPENWA_TIPOS_AVISO:Factura,Orden Venta}
# Modo simulacion: recorre todo el camino (consulta, filtro por tipo, telefono desde SAP, texto)
# y loguea el mensaje en vez de enviarlo. GANA sobre notificar-cliente: si los dos estan en true,
# no sale nada. Es el paso previo recomendado antes de encender el aviso de verdad.
openwa.entregas.simular=${OPENWA_SIMULAR:false}
# Numero de PRUEBA: si se setea, se envia de verdad por openWA pero TODOS los avisos van a este
# numero en lugar del cliente. No hace falta encender notificar-cliente para usarlo.
# Precedencia: simular > telefono-prueba > notificar-cliente.
# [PRUEBA] Numero de pruebas. En produccion tiene que quedar VACIO.
openwa.entregas.telefono-prueba=78888274

# ── Calificacion de la entrega (respuesta del cliente por WhatsApp) ───────────
# El cliente responde con un numero del 1 al 5 al mismo aviso de entrega. Esa respuesta NO llega
# sola: openWA la empuja al backend con un POST a /whatsapp/webhook, y ese endpoint es publico
# (openWA no puede mandar un JWT), asi que se autentica con la firma HMAC del secreto de abajo.
#
# Secreto compartido con openWA para verificar la firma de cada request entrante. Es el MISMO
# valor que se registra en openWA al dar de alta el webhook (campo "secret" del CreateWebhookDto).
# Va VACIO por defecto a proposito: sin secreto el endpoint tiene que rechazar TODO. Es el mismo
# criterio de lista blanca de sap-bases y tipos-con-aviso — ante la duda, no se procesa nada.
# En produccion se setea por variable de entorno, NUNCA escrito aca.
openwa.webhook.secret=${OPENWA_WEBHOOK_SECRET:}
# Interruptor del endpoint del webhook. Apagado por defecto: mientras este en false no se procesa
# ninguna respuesta entrante, aunque openWA las mande.
openwa.webhook.habilitado=${OPENWA_WEBHOOK_ON:false}
# Agrega al final del aviso de entrega el pedido de calificacion (1 a 5) y, por cada aviso que
# openWA acepta, deja una fila esperando la respuesta del cliente.
#
# OJO — ESTAS DOS PROPIEDADES SE ENCIENDEN JUNTAS. pedir-calificacion=true con
# webhook.habilitado=false es el peor estado posible y no falla ruidoso: al cliente se le pide que
# responda con un numero, responde, y del otro lado no hay nadie leyendo. Las filas quedan
# PENDIENTES PARA SIEMPRE (el reporte por chofer las cuenta como enviadas y nunca respondidas), y
# ademas la empresa le pidio algo al cliente y no le contesta. El arranque lo avisa con un WARN,
# pero el sistema igual funciona a medias. Encender el webhook primero, la calificacion despues.
#
# Encenderlo tambien CAMBIA EL PIE DEL MENSAJE: sin calificacion dice "por favor no responda a
# este chat"; con calificacion pasa a invitar a responder con el numero. No se puede tener la
# pregunta y la frase vieja al mismo tiempo, se contradicen.
# [PRUEBA] Encendido para ver el pedido de calificacion en el mensaje. En produccion vuelve a
# false hasta que el webhook este registrado en openWA, o se le pide al cliente algo que nadie lee.
openwa.entregas.pedir-calificacion=${OPENWA_PEDIR_CALIF:true}
# Cuantas horas despues del envio se sigue aceptando la respuesta del cliente. Pasada la ventana,
# un "5" suelto ya no se asocia a ninguna entrega (y con razon: el cliente pudo recibir tres
# entregas desde entonces). Tambien es lo que evita que una fila vieja capture una respuesta que
# era para otra cosa.
openwa.entregas.calificacion-ventana-horas=${OPENWA_CALIF_VENTANA:48}

# ── Contacto del cliente desde SAP (OCRD) por linked server ───────────────────
# El telefono del cliente NO esta en BOSQUE-2_0: vive en OCRD.Cellular / OCRD.Phone1 de
# cada base de SAP, alcanzables por el linked server. La clave del mapa es el valor de la
# columna 'db' de trch_Entregas; lo que NO este en esta lista no se consulta (por eso 'ALL',
# que son los marcadores de inicio/fin de ruta, queda afuera a proposito).
openwa.entregas.sap-linked-server=${OPENWA_SAP_LINKED:SRV_2022}
openwa.entregas.sap-bases=${OPENWA_SAP_BASES:ESP=ESPPAPEL,IPX=IMPEXPAP,PAP=PAPIRUS,PRODPAP=PRODUCTIVA PAPEL}
# SAP esta en otro servidor: si no contesta, la consulta se corta y el aviso se omite.
openwa.entregas.sap-timeout-segundos=${OPENWA_SAP_TIMEOUT:8}
# Fallback a OCRD.Phone1 cuando Cellular no sirve. APAGADO: sube la cobertura de ~72% a ~96%,
# pero 39 de esos 319 clientes caen en un numero que en OCRD es el Cellular de OTRO cliente.
openwa.entregas.usar-phone1=${OPENWA_USAR_PHONE1:false}

# ── Sincronizacion de entregas con SAP ────────────────────────────────────────
# Saca la sincronizacion con SAP de adentro del request del chofer.
#
# ANTES: cada POST /entregas/chofer-entrega ejecutaba la ACCION 'A', que primero sincroniza
# trch_Entregas ENTERA contra SAP por el linked server y recien despues filtra los pendientes de
# UN chofer. Medido contra el servidor real: ~1,4 s en caliente (peor caso 2.129 ms), 417 filas de
# 30 dias y 4 empresas, 490.427 lecturas logicas y 281 MB de memory grant POR EJECUCION. Un chofer
# que abria la app sincronizaba a todos los choferes de todas las empresas, y lo repetia en cada
# refresh. Quince choferes a la misma hora eran quince sincronizaciones identicas y simultaneas.
#
# AHORA: la lectura usa la ACCION 'Y' (solo el SELECT) y la sincronizacion la maneja
# SincronizacionEntregasService: como mucho una vez cada intervalo, UN SOLO hilo a la vez, y el que
# no agarra el candado NO espera — lee lo que haya. Si SAP esta caido, el chofer igual ve su lista.
#
# Interruptor general. En false NO deja al chofer sin sincronizar: vuelve exactamente al
# comportamiento anterior (ACCION 'A', sincroniza dentro de cada request). Es la vuelta atras
# completa sin recompilar, para el caso de que el script SQL con las ACCIONes nuevas ('Y' de
# p_list_trch_Entregas y 'S' de p_abm_trch_EntregasSync) todavia no se haya corrido en esta base.
entregas.sync.habilitado=${ENTREGAS_SYNC_ON:true}
# Cada cuantos segundos, como maximo, se vuelve a sincronizar con SAP. Es la antiguedad maxima de
# los datos que ve un chofer. El reloj cuenta desde el INTENTO, no desde el ultimo exito: con SAP
# caido, un fallo tambien consume el intervalo y no se reintenta en cada request.
# Hay un piso de 15 s: por debajo de eso volveria a ser "una sincronizacion por refresh", y para
# pedir eso esta habilitado=false, que ademas es explicito.
entregas.sync.intervalo-segundos=${ENTREGAS_SYNC_INTERVALO:180}
# Cuanto se espera a SAP antes de cortar la sincronizacion. Holgado a proposito: lo normal son
# 1,4 s y el peor caso medido 2,1 s, asi que llegar a 30 s significa que SAP esta roto, no lento.
# Al cortar, SQL Server revierte lo que la sincronizacion hubiera empezado a escribir, la tabla
# queda como estaba y el chofer recibe igual su lista con los datos anteriores.
entregas.sync.timeout-segundos=${ENTREGAS_SYNC_TIMEOUT:30}

# =====================================================================================
# POOL DEL SCHEDULER
# =====================================================================================
# Spring trae UN SOLO hilo para todos los @Scheduled. Hasta ahora alcanzaba: los tres jobs de
# DatabaseTaskScheduler son cron diarios y no se pisan entre si. Pero el job de sincronizacion de
# entregas corre cada 2 minutos y puede tardar hasta entregas.sync.timeout-segundos (30 s) si SAP
# esta roto; con un solo hilo, esa espera atrasaria el cierre de entregas de las 23:58:59 o el
# aviso de cumpleanios de las 08:00 si llegaran a caer justo encima.
# Con 2 hilos, el job periodico y los cron dejan de competir. No hace falta mas: son cuatro jobs.
spring.task.scheduling.pool.size=2

# =====================================================================================
# COMPRESION DE RESPUESTAS
# =====================================================================================
# Los choferes leen desde el celular, con señal movil y datos moviles. La lista de entregas es un
# JSON de objetos de 49 campos: comprime muchisimo (texto repetitivo, nombres de campo repetidos en
# cada fila) y cada KB que no se transmite es tiempo que el cliente NO pasa esperando con la
# conexion abierta. Esa ventana de espera es justo donde aparecian los "Connection reset by peer".
#
# min-response-size evita gastar CPU comprimiendo respuestas chicas, donde el overhead de gzip no
# se paga. 1024 bytes es el default de Spring Boot y esta bien.
#
# Sobre BREACH (comprimir sobre TLS): no aplica aca. El ataque necesita un secreto reflejado en el
# MISMO cuerpo comprimido junto con texto que controle el atacante. Esta API devuelve datos de
# negocio y autentica por header Authorization, no por un token dentro del body.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

